<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KKE Crew Profile Sheet</title>

<style>
:root {
  --kke-blue: #0057a8;
  --dark: #111827;
  --light: #f3f4f6;
  --border: #d1d5db;
}

body {
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--light);
}

.page {
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.header {
  background:white;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:16px;
}

.header-inner {
  display:grid;
  grid-template-columns:300px 1fr;
  gap:16px;
  padding:16px;
}

/* 🔥 UPDATED LOGO SECTION */
.brand-panel {
  background:white;
  border:1px solid rgba(0,87,168,0.16);
  border-radius:18px;
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:160px;
}

.logo {
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo img {
  width:100%;
  height:100%;
  object-fit:contain;
}

/* TITLE */
.title-box {
  background:var(--kke-blue);
  color:white;
  border-radius:18px;
  padding:20px;
}

.card {
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

label {
  font-weight:700;
  font-size:14px;
}

input, select, textarea {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  margin-top:6px;
}

button {
  padding:14px;
  background:var(--kke-blue);
  color:white;
  border:none;
  border-radius:12px;
  font-weight:800;
}

/* MOBILE */
@media(max-width:800px){
  .grid {grid-template-columns:1fr;}
  .header-inner {grid-template-columns:1fr;}
  .brand-panel {min-height:120px;}
}
</style>
</head>

<body>

<div class="page">

<div class="header">
  <div class="header-inner">

    <div class="brand-panel">
      <div class="logo">
        <img src="logo.png">
      </div>
    </div>

    <div class="title-box">
      <h1>Crew Profile Sheet</h1>
      <p>Field Operations Report</p>
    </div>

  </div>
</div>

<form id="crewForm">

<div class="card">
<h2>Job Info</h2>
<div class="grid">
<label>Job #<input required></label>
<label>Date<input type="date" required></label>
<label>City<input required></label>
<label>Truck #<input required></label>
</div>
</div>

<div class="card">
<h2>Crew</h2>
<div class="grid">
<label>Crew Lead<input required></label>
<label>Sprayer<input></label>
<label>Helper 1<input></label>
<label>Helper 2<input></label>
</div>
</div>

<div class="card">
<h2>Production</h2>
<div class="grid">

<!-- 🔥 DEFAULT 0 -->
<label>A Meter Start<input type="number" value="0"></label>
<label>A Meter Finish<input type="number"></label>
<label>B Meter Start<input type="number" value="0"></label>
<label>B Meter Finish<input type="number"></label>

<label>Estimated Sets<input></label>

<!-- 🔥 DROPDOWN -->
<label>Method
<select>
<option>Method</option>
<option>DI</option>
</select>
</label>

<label>Lift<input required></label>
<label>Clicks<input required></label>

</div>
</div>

<div class="card">
<h2>GPS</h2>
<div class="grid">
<label>Latitude<input id="lat"></label>
<label>Longitude<input id="lng"></label>
</div>

<button type="button" onclick="dropPin()">Drop Pin</button>
</div>

<div class="card">
<h2>Notes</h2>
<textarea rows="4"></textarea>
</div>

<button type="submit">Submit</button>

</form>

</div>

<script>

function dropPin(){
navigator.geolocation.getCurrentPosition(pos=>{
document.getElementById('lat').value=pos.coords.latitude;
document.getElementById('lng').value=pos.coords.longitude;
});
}

/* 🔥 GOOGLE SHEETS HOOK (PUT YOUR URL HERE) */
const SCRIPT_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

document.getElementById("crewForm").addEventListener("submit", e=>{
e.preventDefault();

const data = Object.fromEntries(new FormData(e.target));

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
})
.then(()=>alert("Submitted to Google Sheets"))
.catch(()=>alert("Error submitting"));

});

</script>

</body>
</html>
